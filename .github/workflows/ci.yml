name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false
      - name: Install checksum-pinned Foundry
        run: bash scripts/install-foundry-linux.sh
      - name: Production build and size check
        run: forge build --sizes --skip test --skip script
      - name: Unit, fuzz and invariant tests
        run: forge test --no-match-path 'test/Fork.t.sol' -vvv
